name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and check npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Install real tmux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux util-linux
          tmux -V
          script --version
      - name: Run tests
        run: npm test
      - name: Check npm package contents
        run: npm pack --dry-run
